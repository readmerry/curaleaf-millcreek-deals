name: Check PA Dispensary Deals

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Which menu to scrape"
        required: true
        default: curaleaf
        type: choice
        options:
          - curaleaf
          - rise
          - both

permissions:
  contents: read

concurrency:
  group: pa-dispensary-deals
  cancel-in-progress: false

jobs:
  scrape:
    name: Read live menu and rank deals
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out scraper
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Puppeteer
        run: npm install

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Scrape Curaleaf Millcreek
        id: scrape_curaleaf
        if: inputs.site == 'curaleaf' || inputs.site == 'both'
        continue-on-error: true
        run: PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome node scrape.js --site curaleaf

      - name: Scrape RISE Erie on Lake
        id: scrape_rise
        if: inputs.site == 'rise' || inputs.site == 'both'
        continue-on-error: true
        run: PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome node scrape.js --site rise

      - name: Upload reports or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals-${{ inputs.site }}-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark unsuccessful scrape
        if: steps.scrape_curaleaf.outcome == 'failure' || steps.scrape_rise.outcome == 'failure'
        run: exit 1
